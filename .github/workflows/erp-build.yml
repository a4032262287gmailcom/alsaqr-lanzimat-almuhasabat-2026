name: Validate Alsaqr ERP
on:
  push:
    branches:
      - repair/erp-connection-permissions-20261013
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Restore and build existing .NET Framework project
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore packages
        shell: pwsh
        run: dotnet restore .\AlsaqrERP.sln

      - name: Build Release
        shell: pwsh
        run: dotnet build .\AlsaqrERP.sln --configuration Release --no-restore --no-incremental
